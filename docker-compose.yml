services:
  db:
    image: postgres:16
    container_name: telegram_bot_price_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_bot
      POSTGRES_USER: telegram_bot
      POSTGRES_PASSWORD: telegram_bot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: